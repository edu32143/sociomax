<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOCIOMAX | Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- VARIÁVEIS & CORES --- */
        :root {
            --neon-blue: #287bff;
            --neon-green: #5df25d;
            --neon-purple: #6a5df2;
            --bg-dark: #0b0f1a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-main: #f2faff;
            --text-sec: #a0a0a0;
        }

        /* --- ANIMAÇÕES DE FUNDO --- */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ESTILO GERAL --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(40, 123, 255, 0.1) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(106, 93, 242, 0.1) 0%, transparent 20%);
            min-height: 100vh;
        }

        h1, h2, h3 { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; text-transform: uppercase; }

        /* Container Principal */
        main {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            padding-bottom: 80px;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            padding: 30px 10px;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(40, 123, 255, 0.5);
        }

        header p { color: var(--text-sec); font-size: 0.9rem; margin-top: 5px; }

        /* --- CARTÕES (GLASSMORPHISM) --- */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 25px;
            animation: slideUp 0.6s ease-out;
        }

        /* --- BOTÕES FUTURISTAS --- */
        button {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: white;
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(40, 123, 255, 0.4);
            margin-bottom: 15px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(106, 93, 242, 0.6);
        }

        button:active { transform: scale(0.98); }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--neon-blue);
            box-shadow: none;
        }
        .btn-secondary:hover { background: rgba(40, 123, 255, 0.1); }
        
        .btn-danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); box-shadow: 0 0 10px rgba(255, 65, 108, 0.4); }

        /* --- RADAR CHART --- */
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
            margin: 0 auto;
        }

        /* --- FORMULÁRIOS --- */
        label { display: block; margin-bottom: 10px; color: var(--neon-green); font-size: 0.9rem; font-weight: 600; }
        
        input, select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
            border-bottom: 2px solid var(--neon-blue);
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-size: 1rem;
            margin-bottom: 20px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-bottom-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(93, 242, 93, 0.2);
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            background: #333;
            border-radius: 2px;
        }

        /* --- COMENTÁRIOS --- */
        .chip-container {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;
            scrollbar-width: none; 
        }
        .chip {
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            white-space: nowrap;
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.3s;
        }
        .chip.active {
            background: rgba(40, 123, 255, 0.2);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(40, 123, 255, 0.3);
        }

        .comment-card {
            background: rgba(255,255,255,0.03);
            border-left: 3px solid var(--neon-purple);
            padding: 15px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 15px;
            animation: slideUp 0.4s ease-out;
        }
        .comment-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-sec); margin-bottom: 8px; }
        .badge-score { background: var(--neon-blue); color: black; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; }

        /* --- SPA NAVEGAÇÃO --- */
        .screen { display: none; }
        .screen.active { display: block; }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .chart-container { height: 300px; }
            button { padding: 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>SOCIOMAX</h1>
        <p>Mapeamento Escolar Inteligente</p>
    </header>

    <main>
        <section id="screen-home" class="screen active">
            <div class="glass-card" style="text-align: center;">
                <div class="chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
                <p style="font-size: 0.8rem; color: var(--text-sec); margin-top: 10px;">Toque no gráfico ou nos botões abaixo</p>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <button onclick="nav('screen-report')">📣 Reportar</button>
                <button class="btn-secondary" onclick="nav('screen-comments')">💬 Ver Feed</button>
            </div>
            <button class="btn-secondary" style="margin-top: 15px; border-color: #333; color: #666;" onclick="nav('screen-admin')">🔒 Admin</button>
        </section>

        <section id="screen-report" class="screen">
            <div class="glass-card">
                <button class="btn-secondary" style="width: auto; padding: 8px 15px; margin-bottom: 20px;" onclick="nav('screen-home')">⬅ Voltar</button>
                <h2>Novo Reporte</h2>
                
                <label>Qual o problema?</label>
                <select id="rpt-pillar"></select>

                <label>Onde?</label>
                <select id="rpt-location">
                    <option value="Pátio">Pátio Central</option>
                    <option value="Banheiro Masc">Banheiro Masculino</option>
                    <option value="Banheiro Fem">Banheiro Feminino</option>
                    <option value="Sala de Aula">Sala de Aula</option>
                    <option value="Refeitório">Refeitório / Cantina</option>
                    <option value="Corredores">Corredores</option>
                    <option value="Quadra">Quadra de Esportes</option>
                </select>

                <label>Gravidade (0 = Crítico, 10 = Perfeito)</label>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span style="font-size: 1.5rem; color: var(--neon-blue); font-weight: bold;" id="score-display">5</span>
                    <input type="range" id="rpt-score" min="0" max="10" value="5" oninput="document.getElementById('score-display').innerText = this.value">
                </div>

                <label>Detalhes (Opcional)</label>
                <textarea id="rpt-comment" rows="3" placeholder="Descreva brevemente..."></textarea>

                <label>Identificação (Opcional)</label>
                <input type="text" id="rpt-author" placeholder="Ex: João 2ºA (Vazio = Anônimo)">

                <button onclick="submitReport()">ENVIAR DADOS 🚀</button>
            </div>
        </section>

        <section id="screen-comments" class="screen">
            <div class="glass-card" style="padding-bottom: 10px;">
                <button class="btn-secondary" style="width: auto; padding: 8px 15px;" onclick="nav('screen-home')">⬅ Voltar</button>
                <h2 style="margin-top: 15px;">Feed da Escola</h2>
                
                <div class="chip-container" id="filter-chips">
                    </div>
            </div>

            <div id="comments-list">
                <p style="text-align: center; color: #666;">Carregando dados...</p>
            </div>
        </section>

        <section id="screen-admin" class="screen">
            <div class="glass-card">
                <button class="btn-secondary" style="width: auto;" onclick="nav('screen-home')">⬅ Sair</button>
                <h2>Acesso Restrito</h2>
                <input type="password" id="admin-pass" placeholder="Senha do Administrador">
                <button onclick="loginAdmin()">Entrar no Sistema</button>
            </div>
        </section>

        <section id="screen-dashboard" class="screen">
            <div class="glass-card" style="border-color: var(--neon-purple);">
                <h2>Painel de Controle</h2>
                <p>Usuário: <strong>Admin</strong> | Status: <span style="color: var(--neon-green)">Online</span></p>
                <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">
                
                <button class="btn-secondary" onclick="alert('Funcionalidade de CSV em breve!')">📄 Exportar Relatório</button>
                <button class="btn-danger" onclick="resetSystem()">⚠️ ZERAR TODOS OS DADOS</button>
            </div>
        </section>
    </main>

    <script>
        // --- 1. CONFIGURAÇÃO DO SUPABASE (CORRIGIDO) ---
        const SUPABASE_URL = 'https://tjknlilgaaiyofdlbyxt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqa25saWxnYWFpeW9mZGxieXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ5NzczMTgsImV4cCI6MjA4MDU1MzMxOH0.WFqNmd5O_jTIhBZWLJ3xzZQWjDrCpkmE6x66n3lnD9Y';
        
        // CORREÇÃO 2: Mudamos o nome da variável para 'client' para não dar conflito
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 2. DADOS E VARIÁVEIS ---
        const pillars = [
            "Limpeza", "Segurança", "Espaços", "Água", "Salas", 
            "Banheiros", "Conflitos", "Iluminação", "Recursos", 
            "Acessibilidade", "Merenda", "Social"
        ];
        
        let radarChart;

        // --- 3. INICIALIZAÇÃO VISUAL ---
        function initApp() {
            const select = document.getElementById('rpt-pillar');
            const chipsDiv = document.getElementById('filter-chips');

            select.innerHTML = '';
            chipsDiv.innerHTML = '<div class="chip active" onclick="loadComments(null, this)">Todos</div>';

            pillars.forEach((p, i) => {
                let opt = document.createElement('option');
                opt.value = p;
                opt.innerText = p;
                select.appendChild(opt);

                let chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = p;
                chip.onclick = function() { loadComments(p, this); };
                chipsDiv.appendChild(chip);
            });

            initChart();
            updateChartData();
        }

        // --- 4. CHART.JS CONFIG ---
        function initChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: pillars,
                    datasets: [{
                        label: 'Qualidade Média',
                        data: Array(12).fill(5),
                        backgroundColor: 'rgba(40, 123, 255, 0.2)',
                        borderColor: '#287bff',
                        pointBackgroundColor: '#5df25d',
                        pointBorderColor: '#fff',
                        borderWidth: 2,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            pointLabels: {
                                color: '#a0a0a0',
                                font: { family: 'Orbitron', size: 10 }
                            },
                            ticks: { display: false, backdropColor: 'transparent' },
                            suggestedMin: 0,
                            suggestedMax: 10
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // --- 5. NAVEGAÇÃO ---
        function nav(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if(screenId === 'screen-home') updateChartData();
            if(screenId === 'screen-comments') loadComments(null);
        }

        // --- 6. FUNÇÕES SUPABASE (CORRIGIDAS: client.from) ---

        async function submitReport() {
            const pillar = document.getElementById('rpt-pillar').value;
            const location = document.getElementById('rpt-location').value;
            const score = document.getElementById('rpt-score').value;
            const comment = document.getElementById('rpt-comment').value;
            const author = document.getElementById('rpt-author').value || "Anônimo";

            // CORREÇÃO 3: Usando 'client' em vez de 'supabase'
            const { error } = await client
                .from('reports')
                .insert([{ pillar, location, score, comment, author }]);

            if (error) {
                alert('Erro ao enviar: ' + error.message);
            } else {
                alert('Reporte enviado com sucesso! 🚀');
                document.getElementById('rpt-comment').value = '';
                nav('screen-home');
            }
        }

        async function updateChartData() {
            // CORREÇÃO 3: Usando 'client'
            const { data, error } = await client
                .from('reports')
                .select('pillar, score');

            if (error || !data) return;

            let sums = {};
            let counts = {};
            pillars.forEach(p => { sums[p] = 0; counts[p] = 0; });

            data.forEach(row => {
                if (sums[row.pillar] !== undefined) {
                    sums[row.pillar] += row.score;
                    counts[row.pillar]++;
                }
            });

            const averages = pillars.map(p => {
                return counts[p] > 0 ? (sums[p] / counts[p]).toFixed(1) : 5;
            });

            radarChart.data.datasets[0].data = averages;
            radarChart.update();
        }

        async function loadComments(pillarFilter, chipElement) {
            if(chipElement) {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                chipElement.classList.add('active');
            }

            const list = document.getElementById('comments-list');
            list.innerHTML = '<p style="text-align:center; color:#666;">Buscando dados na nuvem...</p>';

            // CORREÇÃO 3: Usando 'client'
            let query = client.from('reports').select('*').order('created_at', { ascending: false }).limit(20);
            
            if (pillarFilter) {
                query = query.eq('pillar', pillarFilter);
            }

            const { data, error } = await query;

            if (error) {
                list.innerHTML = '<p>Erro ao carregar.</p>';
                return;
            }

            if (data.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#666;">Nenhum reporte ainda.</p>';
                return;
            }

            let html = '';
            data.forEach(item => {
                let badgeColor = item.score < 4 ? '#ff4b2b' : (item.score < 7 ? '#f7b731' : '#5df25d');
                
                html += `
                <div class="comment-card" style="border-left-color: ${badgeColor}">
                    <div class="comment-header">
                        <span><strong>${item.pillar}</strong> • ${item.location}</span>
                        <span class="badge-score" style="background:${badgeColor}">${item.score}</span>
                    </div>
                    <p style="margin: 5px 0; font-size: 0.95rem;">${item.comment || "<i>Sem descrição</i>"}</p>
                    <div style="font-size: 0.75rem; color: #666; margin-top: 8px;">
                        Por: ${item.author} • ${new Date(item.created_at).toLocaleDateString()}
                    </div>
                </div>`;
            });

            list.innerHTML = html;
        }

        function loginAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === '27062009') {
                nav('screen-dashboard');
            } else {
                alert('Acesso negado.');
            }
        }

        async function resetSystem() {
            if(!confirm("TEM CERTEZA? Isso apagará todos os reportes da escola.")) return;
            
            // CORREÇÃO 3: Usando 'client'
            const { error } = await client
                .from('reports')
                .delete()
                .neq('id', 0);

            if(error) alert("Erro: " + error.message);
            else {
                alert("Sistema reiniciado com sucesso.");
                updateChartData();
                nav('screen-home');
            }
        }

        window.onload = initApp;

    </script>
</body>
</html>
